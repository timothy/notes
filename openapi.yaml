    # ---- Errors -------------------------------------------------------------
    Problem:
      type: object
      required: [type, title, status, code]
      description: >-
        RFC 9457 Problem Details. `type` is `https://notes-api.example.com/problems/{code}` and `code` is the
        stable machine-readable key. `detail` is explanatory text for humans and never a client control-flow
        key. Errors never expose stack traces, note contents, or recipient data beyond the caller's
        permissions. Extension members may be added in future versions.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldError'
          description: Individual field issues for `422` and some `400` responses.
    FieldError:
      type: object
      additionalProperties: false
      required: [location, pointer, detail]
      properties:
        location:
          $ref: '#/components/schemas/ErrorLocation'
        pointer:
          type: string
          description: For `body`, an RFC 6901 JSON Pointer into the request body (for example `/recipient/id`); for `query`, `header`, and `path`, the parameter name.
        detail:
          type: string

