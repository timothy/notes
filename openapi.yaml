openapi: 3.1.2
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Notes API
  version: 2.0.0
  summary: Notes owned by one person or several, shared with people and teams, with comments and owner-reviewed edit requests.
  description: |
    REST contract for a notes service used by several small teams in one workspace.

    * Notes belong to their author (`authorId`), who may add co-owners (`ownerIds`), and are shared to users
      or teams with independent `read`, `comment`, and `propose_edit` permissions. No share grants write.
    * Non-owners never edit live content: they submit edit requests, which owners preview with a line-based
      three-way merge and then merge, reject, or leave open. A note with more than one owner is protected:
      its owners' own changes go through edit requests too, and the note's review policy (`self_merge`, or
      `peer_approval` with a configurable approval count) decides when a request may merge.
    * Every operation requires an external identity provider's bearer **access token**. Every response,
      including errors, carries `Cache-Control: no-store`.
    * Conditional mutations on notes (including their owners and review policy), comments, and edit
      requests use strong ETags with `If-Match`.
      Teams, memberships, and shares carry no ETag and mutate unconditionally.
    * Errors are RFC 9457 Problem Details (`application/problem+json`) with a stable `code` from the
      `ErrorCode` enum. A missing resource and one the caller may not discover are both `404`; a visible
      resource the caller may not act on is `403`.

    The normative design guide is `docs/design-guide.md`. Operation descriptions and schemas in this
    document are normative too. This is a contract only; there is no reference server.
servers:
  - url: https://notes-api.example.com/v1
    description: Placeholder host. Every route and every `Location` value is prefixed with `/v1`.
security:
  - bearerAuth: []
tags:
  - name: Users
    description: The registered-user directory and the caller's own profile.
  - name: Teams
    description: Workspace teams that can receive note shares.
  - name: Memberships
    description: Team membership and roles.
  - name: Notes
    description: Note content, tags, trash, and restore.
  - name: Ownership
    description: Co-owners and the review policy that protects multi-owner notes.
  - name: Shares
    description: Owner-managed grants to users or teams.
  - name: Comments
    description: Flat Markdown comments on a note or an edit request.
  - name: Edit requests
    description: Proposed changes, three-way preview, approvals, and atomic merge.

paths:
  /me:
    get:
      tags: [Users]
      summary: Get the calling user
      operationId: getCurrentUser
      description: >-
        Returns the local profile mapped to the validated `(issuer, subject)` of the access token. First
        authenticated access provisions the profile; concurrent first access never creates duplicates.
        Clients call this to learn their own `id`.
      responses:
        '200':
          description: The caller's profile.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                owner:
                  $ref: '#/components/examples/UserOwner'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: List registered users
      operationId: listUsers
      description: >-
        Directory of registered users sorted by `createdAt DESC, id DESC`. Exposes IDs, display names, and
        creation times only, never tokens, emails, or provider subjects.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of users.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
              examples:
                page:
                  $ref: '#/components/examples/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user
      operationId: getUser
      description: Returns one registered user's public profile. Unknown IDs return `404`.
      responses:
        '200':
          description: The user.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                owner:
                  $ref: '#/components/examples/UserOwner'
                proposer:
                  $ref: '#/components/examples/UserProposer'
                coOwner:
                  $ref: '#/components/examples/UserCoOwner'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /teams:
    post:
      tags: [Teams]
      summary: Create a team
      operationId: createTeam
      description: >-
        Any registered user may create a team and atomically becomes its first `admin`. Team names need not
        be unique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeam'
            examples:
              platform:
                $ref: '#/components/examples/CreateTeamRequest'
      responses:
        '201':
          description: Team created. `Location` is the team's canonical URL.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
              examples:
                platform:
                  $ref: '#/components/examples/TeamPlatform'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags: [Teams]
      summary: List teams
      operationId: listTeams
      description: >-
        All registered users can discover team metadata. `scope=mine` narrows the list to teams the caller
        currently belongs to. Sorted by `createdAt DESC, id DESC`.
      parameters:
        - $ref: '#/components/parameters/TeamScopeFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of teams.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
              examples:
                page:
                  $ref: '#/components/examples/TeamPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      summary: Get a team
      operationId: getTeam
      description: Team metadata is visible to every registered user. Unknown IDs return `404`.
      responses:
        '200':
          description: The team.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
              examples:
                platform:
                  $ref: '#/components/examples/TeamPlatform'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags: [Teams]
      summary: Rename a team
      operationId: updateTeam
      description: >-
        Team admins only; members and nonmembers receive `403`. Teams carry no ETag, so the update is
        unconditional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeam'
            examples:
              rename:
                $ref: '#/components/examples/UpdateTeamRequest'
      responses:
        '200':
          description: The renamed team.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
              examples:
                platform:
                  $ref: '#/components/examples/TeamPlatform'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Teams]
      summary: Delete a team
      operationId: deleteTeam
      description: >-
        Team admins only. Removes the team, all of its memberships, and every share addressed to it. Notes,
        comments, and edit requests survive because they belong to people. Unconditional (no ETag).
      responses:
        '204':
          description: Team deleted.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /teams/{teamId}/members:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Memberships]
      summary: List team members
      operationId: listMemberships
      description: >-
        Members only. Because team metadata is discoverable by everyone, a nonmember receives `403` rather
        than `404`. Sorted by `joinedAt DESC, userId DESC`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of memberships.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
              examples:
                page:
                  $ref: '#/components/examples/MembershipPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags: [Memberships]
      summary: Add a member
      operationId: addMembership
      description: >-
        Team admins only. Adds an existing registered user; `role` defaults to `member`. An unknown `userId`
        is `422` (pointer `/userId`); an existing membership is `409` with code `duplicate_membership`.
        `Location` is `/v1/teams/{teamId}/members/{userId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMembership'
            examples:
              member:
                $ref: '#/components/examples/AddMembershipRequest'
      responses:
        '201':
          description: Membership created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
              examples:
                member:
                  $ref: '#/components/examples/MembershipMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictAddMembership'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /teams/{teamId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Memberships]
      summary: Change a member's role
      operationId: updateMembership
      description: >-
        Team admins only. Demoting the last admin is rejected atomically with `409` and code `last_admin`,
        including under concurrent attempts. Unconditional (memberships carry no ETag). A user who is not a
        member is `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembership'
            examples:
              promote:
                $ref: '#/components/examples/UpdateMembershipRequest'
      responses:
        '200':
          description: The updated membership.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
              examples:
                admin:
                  $ref: '#/components/examples/MembershipAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictLastAdmin'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Memberships]
      summary: Remove a member
      operationId: removeMembership
      description: >-
        Team admins may remove any member; a non-admin may remove only their own membership (`403`
        otherwise). Removing the last admin, including an admin leaving, is rejected atomically with `409`
        and code `last_admin`. A missing membership is `404`.
      responses:
        '204':
          description: Membership removed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictLastAdmin'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /notes:
    post:
      tags: [Notes]
      summary: Create a note
      operationId: createNote
      description: >-
        Creates a private note owned by the caller. `title` is required; an omitted `body` defaults to `""`
        and omitted `tags` to `[]`. The server assigns `id`, `authorId`, and timestamps; supplying them or any
        unknown field is `422`. The response carries the note's initial strong `ETag`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNote'
            examples:
              releaseChecklist:
                $ref: '#/components/examples/CreateNoteRequest'
      responses:
        '201':
          description: Note created. `Location` is `/v1/notes/{noteId}`; `ETag` is the note's version.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
              examples:
                created:
                  $ref: '#/components/examples/NoteV1Owner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags: [Notes]
      summary: List or search accessible notes
      operationId: listNotes
      description: >-
        Returns summaries (no `body`) of notes the caller may read, each exactly once regardless of
        overlapping grants. Filters combine with AND, except that `q` matches title OR body using a
        Unicode-aware, case-insensitive literal substring (no stemming, regular expressions, or query
        language). `tag` may be repeated; every listed tag must be present (exact, case-sensitive). `scope`
        defaults to `all`; `mine` selects owned notes and `shared` selects accessible non-owned notes. `state`
        defaults to `active`; `trashed` always restricts to notes the caller owns, so
        `scope=shared&state=trashed` is empty. `teamId` selects notes currently shared to that team and grants
        nothing by itself; combined with `state=trashed` it is empty because trashing removes shares. Unknown
        IDs yield an empty result. Sorted by `createdAt DESC, id DESC`. Authorization is re-evaluated on
        every page; paging is a live view, not a snapshot.
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/NoteScopeFilter'
        - $ref: '#/components/parameters/NoteStateFilter'
        - $ref: '#/components/parameters/TeamIdFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of note summaries.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteSummaryPage'
              examples:
                page:
                  $ref: '#/components/examples/NoteSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    get:
      tags: [Notes]
      summary: Get a note
      operationId: getNote
      description: >-
        The full note including `body`, with the note's strong `ETag`. Visible to every owner and to anyone
        with current `read` through a direct or team share. A trashed note is visible to its owners only;
        expired, hidden, and missing notes are all `404`. `isOwner` and `effectivePermissions` describe the
        caller, never anyone else; `ownerIds` and `reviewPolicy` show who owns the note and how it accepts
        changes.
      responses:
        '200':
          description: The note.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
              examples:
                asOwner:
                  $ref: '#/components/examples/NoteV1Owner'
                asRecipient:
                  $ref: '#/components/examples/NoteV1Proposer'
                trashedAsOwner:
                  $ref: '#/components/examples/NoteTrashedOwner'
                protected:
                  $ref: '#/components/examples/NoteRunbookProtected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags: [Notes]
      summary: Update note content or tags
      operationId: updateNote
      description: >-
        Owners only; other readers receive `403`. Requires `If-Match` with the current note ETag. At least one
        of `title`, `body`, or `tags` must be supplied; omitted properties are unchanged and a supplied `tags`
        array replaces the previous one. On a protected note (more than one owner) a request naming `title`
        or `body` is refused whole with `409` and code `direct_edit_not_allowed`: content changes go through
        edit requests, and only `tags` may be edited directly. The protection check runs inside the write
        transaction. A trashed note is `409` with code `note_not_active`. An effective change advances the
        ETag and `updatedAt`; a no-op may return the existing representation and ETag.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNote'
            examples:
              retitle:
                $ref: '#/components/examples/UpdateNoteRequest'
      responses:
        '200':
          description: The updated note with its new `ETag`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
              examples:
                updated:
                  $ref: '#/components/examples/NoteV3Owner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictUpdateNote'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [Notes]
      summary: Move a note to the trash
      operationId: trashNote
      description: >-
        Owners only. Requires `If-Match` with the current ETag. Atomically removes every share (owners are
        kept), sets `deletedAt`, sets `expiresAt` to exactly 30 × 24 hours later, and advances the ETag and
        `updatedAt`. Comments and edit requests are preserved but frozen. The `204` carries the new trash
        ETag so an owner can restore without another read. Repeating the request with the trash ETag returns `204`
        again without extending the recovery period.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Note trashed. `ETag` is the trashed note's version, needed for restore.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /notes/{noteId}/restore:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    post:
      tags: [Notes]
      summary: Restore a trashed note
      operationId: restoreNote
      description: >-
        Owners only. Requires `If-Match` with the trash ETag. Clears `deletedAt` and `expiresAt`, advances the
        ETag and `updatedAt` even when title and body are unchanged, preserves comments, approvals, and
        edit-request states, and leaves all shares absent: a restored note is private to its owners until
        re-shared. Open requests reappear in the owners' inboxes, but their proposers regain no access. Restoring an active note is
        `409` with code `note_already_active`; at or after `expiresAt` the note is `404`. No request body.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The restored, now private note with its new `ETag`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
              examples:
                restored:
                  $ref: '#/components/examples/NoteRestoredOwner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictRestore'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /notes/{noteId}/owners:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    post:
      tags: [Ownership]
      summary: Add a co-owner
      operationId: addOwner
      description: >-
        Author only; co-owners and other readers receive `403`. Requires `If-Match` with the current note
        ETag. Adds an existing user to `ownerIds`; with two or more owners the note becomes protected and its
        title and body change only through approved edit requests. A share the new owner already holds is
        left in place. Advances the note ETag and `updatedAt` and returns the note. An existing owner is
        `409` with code `duplicate_owner`; an unknown user or a twenty-first owner is `422`; a trashed note is
        `409` with code `note_not_active`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOwner'
            examples:
              addCara:
                $ref: '#/components/examples/AddOwnerRequest'
      responses:
        '200':
          description: The note with its new owner and `ETag`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
