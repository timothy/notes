    get:
      tags: [Comments]
      summary: Get a comment
      operationId: getComment
      description: >-
        Readable by anyone who can read the note. The comment must belong to the note in the path;
        otherwise `404`. Returns the comment's `ETag` for conditional edits.
      responses:
        '200':
          description: The comment.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
