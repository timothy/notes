        '200':
          description: The share.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
              examples:
                share:
                  $ref: '#/components/examples/ShareCommentProposeEdit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
