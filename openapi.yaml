        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags: [Shares]
      summary: Replace a share's permissions
      operationId: updateShare
      description: >-
        Owners only. Replaces the permission set; it never appends. Recipient identity cannot be changed:
