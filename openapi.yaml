  /notes/{noteId}/owners/{userId}:
    parameters:
      - $ref: '#/components/parameters/NoteId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Ownership]
      summary: Remove a co-owner
      operationId: removeOwner
      description: >-
        The author may remove any co-owner and a co-owner may remove only themselves; anyone else receives
        `403`, and a user who is not an owner is `404`. Requires `If-Match` with the current note ETag.
        Removing the author is `409` with code `author_cannot_be_removed`. In the same transaction the
        removed user's approvals are deleted from every open request on the note, advancing those requests'
        ETags. If one owner remains the note is no longer protected and direct edits resume; open requests
        stay open. Advances the note ETag and `updatedAt` and returns the note. A trashed note is `409` with
        code `note_not_active`. No request body.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The note without the removed owner, with its new `ETag`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
              examples:
                note:
                  $ref: '#/components/examples/NoteRunbookAfterOwnerLeft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictRemoveOwner'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /notes/{noteId}/review-policy:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    patch:
      tags: [Ownership]
      summary: Set the review policy
      operationId: updateReviewPolicy
      description: >-
        Author only; co-owners and other readers receive `403`. Requires `If-Match` with the current note
        ETag. Replaces the policy: `self_merge` with `requiredApprovals: null`, or `peer_approval` with an
        integer from 1 up to the current number of owners (a larger value is `422`). The policy may be set on
        a single-owner note and takes effect once the note is protected; if owners later leave, the stored
        value persists and each request's effective `requiredApprovals` clamps to the owners available.
        Advances the note ETag and `updatedAt` and returns the note. A trashed note is `409` with code
        `note_not_active`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPolicy'
            examples:
              peerApproval:
                $ref: '#/components/examples/ReviewPolicyPeerApprovalRequest'
      responses:
        '200':
          description: The note with its new review policy and `ETag`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
              examples:
                note:
                  $ref: '#/components/examples/NoteRunbookPeerApproval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictNoteNotActive'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Schema violation, unknown field, or `requiredApprovals` above the current owner count.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validationFailed:
                  $ref: '#/components/examples/ProblemValidationFailed'
                requiredApprovalsExceedOwners:
                  $ref: '#/components/examples/ProblemRequiredApprovalsExceedOwners'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /notes/{noteId}/shares:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    get:
      tags: [Shares]
      summary: List a note's shares
      operationId: listShares
      description: >-
        Owners only; other readers receive `403`. A trashed note has no shares. Sorted by
        `createdAt DESC, id DESC`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of shares.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePage'
              examples:
                page:
                  $ref: '#/components/examples/SharePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags: [Shares]
      summary: Share a note
      operationId: createShare
      description: >-
        Owners only. Grants a user or a team, including teams the caller does not belong to. `permissions` may
        contain `read`, `comment`, and `propose_edit` in any combination (at least one, no duplicates); the
        server adds implied `read` and stores canonical order. Sharing to an owner or to an unknown
        recipient is `422`; a second share for the same recipient is `409` with code `duplicate_share`; a
        trashed note is `409` with code `note_not_active`. Shares carry no ETag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShare'
            examples:
              proposeEditToUser:
                $ref: '#/components/examples/CreateShareRequest'
      responses:
        '201':
          description: Share created with canonical permissions. `Location` is `/v1/notes/{noteId}/shares/{shareId}`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
              examples:
                proposeEditToUser:
                  $ref: '#/components/examples/ShareProposeEdit'
                readOnlyToTeam:
                  $ref: '#/components/examples/ShareTeamRead'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictCreateShare'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
