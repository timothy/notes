              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validationFailed:
                  $ref: '#/components/examples/ProblemValidationFailed'
                shareToOwner:
                  $ref: '#/components/examples/ProblemShareToOwner'

  /notes/{noteId}/shares/{shareId}:
    parameters:
